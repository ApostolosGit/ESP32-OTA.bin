name: Build Boiler v4.04 SSD1309 1.3 USB test
on:
  push:
    branches:
      - build/boiler-v404-ssd1309-usb
    paths:
      - .github/workflows/build-boiler-v404-ssd1309-usb.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@v4
        with:
          repository: ApostolosGit/ESP32
          ref: 268e57dde38a240346905a7c58c250d5c475cfb0
          path: firmware-source
          persist-credentials: false

      - name: Verify display and firmware target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C firmware-source rev-parse HEAD)" = "268e57dde38a240346905a7c58c250d5c475cfb0"
          python3 - <<'PY'
          from pathlib import Path
          s=Path("firmware-source/Boiler/Boiler_ESP32C3_V4_04/Boiler_ESP32C3_V4_04.ino").read_text()
          for mark in ['#define VERSION "4.04"', '#define PLATFORM_VERSION "1.06"',
                       '#define OLED_TYPE 2', 'WIFI_AP_STA', 'WIFI_POWER_15dBm',
                       'return IPAddress(192, 168, 2, configuredStaOctet);',
                       'static const uint8_t btPins[4] = {5, 6, 7, 21}']:
              if mark not in s:
                  raise SystemExit("Missing target invariant: "+mark)
          if s.count("void setup()")!=1 or s.count("void loop()")!=1:
              raise SystemExit("Unexpected sketch entrypoints")
          PY

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"

      - name: Install ESP32-C3 core and libraries
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib update-index
          arduino-cli lib install "PubSubClient@2.8"
          arduino-cli lib install "U8g2"
          arduino-cli lib install "OneWire@2.3.8"
          arduino-cli lib install "DallasTemperature"
          python3 -m pip install --user "esptool==4.9.0"

      - name: Compile with SSD1309 1.3-inch profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32c3:CDCOnBoot=cdc,CPUFreq=160,FlashFreq=40,FlashMode=dio,FlashSize=4M,PartitionScheme=min_spiffs,DebugLevel=none" \
            --jobs 2 \
            --output-dir build \
            firmware-source/Boiler/Boiler_ESP32C3_V4_04
          test -s build/Boiler_ESP32C3_V4_04.ino.bin

      - name: Create complete 4MB USB-flash image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          root=Path("build")
          def one(pattern):
              m=list(root.glob(pattern))
              if len(m)!=1: raise RuntimeError(f"{pattern}: expected one file, got {m}")
              return str(m[0])
          boot=one("*.bootloader.bin")
          part=one("*.partitions.bin")
          app=one("Boiler_ESP32C3_V4_04.ino.bin")
          ota=one("../firmware-source/nonexistent") if False else str(Path.home()/".arduino15/packages/esp32/hardware/esp32/3.3.12/tools/partitions/boot_app0.bin")
          if not Path(ota).is_file(): raise RuntimeError("Missing boot_app0")
          image="Boiler_ESP32C3_V4_04_SSD1309_1p3_FULL_MERGED_0x0000.bin"
          subprocess.run(["python3","-m","esptool","--chip","esp32c3","merge_bin",
             "-o",image,"--flash_mode","dio","--flash_freq","40m",
             "--flash_size","4MB","--fill-flash-size","4MB",
             "0x0",boot,"0x8000",part,"0xe000",ota,"0x10000",app],check=True)
          data=Path(image).read_bytes()
          assert len(data)==4194304 and data[0]==0xe9 and data[0x10000]==0xe9
          sha=hashlib.sha256(data).hexdigest()
          Path("Boiler_ESP32C3_V4_04_SSD1309_1p3_SHA256SUMS.txt").write_text(f"{sha}  {image}\n")
          print(image, len(data),sha)
          PY

      - name: Upload USB image
        uses: actions/upload-artifact@v4
        with:
          name: Boiler_v404_SSD1309_1p3_USB_full
          path: |
            Boiler_ESP32C3_V4_04_SSD1309_1p3_FULL_MERGED_0x0000.bin
            Boiler_ESP32C3_V4_04_SSD1309_1p3_SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error