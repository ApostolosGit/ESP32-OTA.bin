name: Build and publish Boiler v4.01 SH1106 app OTA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-boiler-v401-sh1106-public.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boiler-v401-sh1106-public
  cancel-in-progress: false

jobs:
  firmware:
    if: github.repository == 'ApostolosGit/ESP32-OTA.bin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout OTA publishing repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Checkout public, pinned firmware source
        uses: actions/checkout@v4
        with:
          repository: ApostolosGit/ESP32
          ref: e496ab02019d09b06afba50a947a28830e2b6f4f
          path: firmware-source
          persist-credentials: false

      - name: Verify source, platform and target OTA identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('firmware-source/Boiler/Boiler_ESP32C3_V4_01/Boiler_ESP32C3_V4_01.ino').read_text()
          platform = Path('firmware-source/CommonPlatform/ESP32-C3-supermiini-CommonPlatoform.ino').read_text()
          checks = {
              "firmware version": '#define VERSION "4.01"',
              "shared platform": '#define PLATFORM_VERSION "1.05"',
              "device kind": '#define DEVICE_KIND "BOILER"',
              "application": '#define APPLICATION_ID "boiler"',
              "protocol": '#define OTA_PROTOCOL_VERSION 2',
              "OLED": '#define OLED_TYPE 1',
              "OTA filename prefix": '#define PLATFORM_OTA_FILENAME_PREFIX "Boiler_ESP32C3_V"',
              "OTA filename suffix": '#define PLATFORM_OTA_FILENAME_SUFFIX ".bin"',
              "sensor pins": 'static const uint8_t btPins[4] = {5, 6, 7, 21}',
              "profile": '#define OTA_PROFILE_PREFIX "esp32c3-boiler-4ds18b20"',
              "target": 'CONFIG_IDF_TARGET_ESP32C3',
              "OTA handler": 'stageRemoteHttpsOtaCommand',
              "web": 'boilerChartsPage',
              "sensor": 'applicationReadMeasurements'
          }
          for name, mark in checks.items():
              if mark not in source:
                  raise SystemExit('Missing firmware invariant: '+name)
          if '#define PLATFORM_VERSION "1.05"' not in platform:
              raise SystemExit('Unexpected CommonPlatform revision')
          shared_markers = ('bool platformIsAllowedOtaUrl(', 'void remoteOtaFailAndRestart(',
                            'void platformDnsComplete(', 'const uint16_t DEVICE_CREDENTIAL_VERSION = 2;')
          for mark in shared_markers:
              if mark not in source or mark not in platform:
                  raise SystemExit('Missing shared platform service: '+mark)
          if source.count('void setup()') != 1 or source.count('void loop()') != 1:
              raise SystemExit('Unexpected sketch entrypoints')
          print('Boiler 4.01 SH1106 / CommonPlatform 1.05 source checks PASSED')
          PY

      - name: Install Arduino CLI and ESP32 core
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"

      - name: Install ESP32-C3 core and libraries
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib update-index
          arduino-cli lib install "PubSubClient@2.8"
          arduino-cli lib install "U8g2"
          arduino-cli lib install "OneWire@2.3.8"
          arduino-cli lib install "DallasTemperature"

      - name: Compile application-only ESP32-C3 binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32c3:CDCOnBoot=cdc,CPUFreq=160,FlashFreq=40,FlashMode=dio,FlashSize=4M,PartitionScheme=min_spiffs,DebugLevel=none" \
            --jobs 2 \
            --output-dir build \
            firmware-source/Boiler/Boiler_ESP32C3_V4_01
          test -s build/Boiler_ESP32C3_V4_01.ino.bin

      - name: Check image and publish OTA manifest atomically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil

          binary = Path('build/Boiler_ESP32C3_V4_01.ino.bin')
          target = Path('Boiler_ESP32C3_V4_01.bin')
          data = binary.read_bytes()
          if data[0] != 0xe9 or not (100000 < len(data) < 0x1e0000):
              raise SystemExit('Not a valid-sized ESP32-C3 OTA application binary')
          manifest_path = Path('manifest-boiler-sh1106.txt')
          if manifest_path.exists():
              previous = manifest_path.read_text()
              required = ('version=4.01\n', 'oled=SH1106\n',
                          'profile=esp32c3-boiler-4ds18b20-sh1106\n',
                          'file=Boiler_ESP32C3_V4_01.bin\n')
              if not all(marker in previous for marker in required):
                  raise SystemExit('Unexpected SH1106 manifest; refusing overwrite')
          active_ssd = Path('manifest-boiler.txt').read_text()
          if ('oled=SSD1309\n' not in active_ssd or
                  'profile=esp32c3-boiler-4ds18b20-ssd1309\n' not in active_ssd):
              raise SystemExit('Existing SSD1309 OTA manifest changed unexpectedly')

          shutil.copyfile(binary, target)
          md5 = hashlib.md5(data).hexdigest()
          sha = hashlib.sha256(data).hexdigest()
          manifest = [
              'version=4.01',
              'file=Boiler_ESP32C3_V4_01.bin',
              'size='+str(len(data)),
              'md5='+md5,
              'meter=BOILER',
              'oled=SH1106',
              'application=boiler',
              'platform_version=1.05',
              'driver=4xDS18B20',
              'profile=esp32c3-boiler-4ds18b20-sh1106',
              'ota_protocol=2',
              'status=PUBLIC_OTA',
              'hardware_validation=V4_01_SH1106_NOT_HARDWARE_TESTED',
              'platform=ESP32-C3',
              'sha256='+sha,
              'release=boiler-v4.01-sh1106-app-ota',
          ]
          Path('manifest-boiler-sh1106.txt').write_text('\n'.join(manifest)+'\n')
          Path('Boiler_ESP32C3_V4_01_SHA256SUMS.txt').write_text(sha+'  '+target.name+'\n')
          doc = (
              '## Boiler v4.01 — SH1106 1.3-inch application OTA (CommonPlatform v1.05)\n\n'
              '- [OTA application image](./Boiler_ESP32C3_V4_01.bin) for ESP32-C3 only.\n'
              '- [Active manifest](./manifest-boiler-sh1106.txt) and [SHA256](./Boiler_ESP32C3_V4_01_SHA256SUMS.txt).\n'
              '- Shared services from CommonPlatform 1.05; four DS18B20 on GPIO5/6/7/21, 1.3-inch SH1106 GPIO3/4.\n'
              '- OTA protocol 2 and dedicated SH1106 profile. SSD1309 v4.00 remains unchanged. No full-chip/USB image in this release.\n'
              '- **Hardware/OTA update has not yet been verified on a device.** Operator-confirmed update only; keep local recovery access.\n\n'
          )
          readme = Path('README.md').read_text()
          if '## Boiler v4.01 — SH1106 1.3-inch application OTA' in readme:
              start = readme.index('## Boiler v4.01 — SH1106 1.3-inch application OTA')
              stop = readme.find('## ', start + 3)
              if stop < 0:
                  stop = len(readme)
              readme = readme[:start] + doc + readme[stop:]
          else:
              readme = readme.replace('# ESP32-C3 firmware downloads\\n\\n', '# ESP32-C3 firmware downloads\\n\\n'+doc, 1)
          Path('README.md').write_text(readme)
          print('firmware',target.name,'bytes',len(data),'md5',md5,'sha256',sha)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Boiler_ESP32C3_V4_01.bin Boiler_ESP32C3_V4_01_SHA256SUMS.txt manifest-boiler-sh1106.txt README.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "v4.01 SH1106 already published"
          else
            git commit -m "release(boiler): publish v4.01 SH1106 OTA and dedicated manifest"
            git push
          fi

      - name: Build summary
        shell: bash
        run: |
          echo "Boiler v4.01 SH1106 compiled; app-only BIN and dedicated manifest published." >> "$GITHUB_STEP_SUMMARY"
          echo "Device / live OTA verification is not claimed." >> "$GITHUB_STEP_SUMMARY"
